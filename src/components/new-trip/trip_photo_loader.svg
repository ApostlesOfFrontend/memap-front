<svg width="100%" viewBox="190 60 300 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Loading — saving your trip</title>
  <desc>Looping animation of a globe with an orbiting airplane, pulsing location markers, and photo frames appearing and fading around it</desc>

  <defs>
    <path id="op" d="M340,70 A140,140 0 0 1 480,210 A140,140 0 0 1 340,350 A140,140 0 0 1 200,210 A140,140 0 0 1 340,70"/>
  </defs>

  <!-- Globe fill -->
  <circle cx="340" cy="210" r="95" fill="rgba(91,130,232,0.04)"/>

  <!-- Globe latitudes -->
  <ellipse cx="340" cy="210" rx="95" ry="27" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <ellipse cx="340" cy="210" rx="95" ry="62" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>

  <!-- Globe longitudes -->
  <line x1="340" y1="115" x2="340" y2="305" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <line x1="245" y1="210" x2="435" y2="210" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <path d="M296,118 Q258,210 296,302" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <path d="M384,118 Q422,210 384,302" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>

  <!-- Globe outline -->
  <circle cx="340" cy="210" r="95" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Orbit ring -->
  <circle cx="340" cy="210" r="140" fill="none" stroke="rgba(91,130,232,0.22)" stroke-width="1" stroke-dasharray="10 8" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 340 210" to="360 340 210" dur="28s" repeatCount="indefinite"/>
  </circle>

  <!-- Photo frame 1 — upper left — teal -->
  <g transform="translate(232,135)">
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.2;0.75;1" dur="4.5s" repeatCount="indefinite" begin="0s"/>
      <animateTransform attributeName="transform" type="translate" values="0,12;0,12;0,0;0,-8;0,-8" keyTimes="0;0.05;0.2;0.75;1" dur="4.5s" repeatCount="indefinite" begin="0s"/>
      <rect x="-21" y="-15" width="42" height="30" rx="3" fill="rgba(61,185,149,0.09)" stroke="#3DB995" stroke-width="1.2" stroke-opacity="0.65"/>
      <path d="M-13,9 L-4,-3 L5,9 Z" fill="rgba(61,185,149,0.55)"/>
      <path d="M-2,9 L9,-2 L16,9 Z" fill="rgba(61,185,149,0.35)"/>
      <circle cx="-11" cy="-5" r="3.5" fill="rgba(61,185,149,0.45)"/>
    </g>
  </g>

  <!-- Photo frame 2 — upper right — blue -->
  <g transform="translate(452,140)">
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.2;0.75;1" dur="4.5s" repeatCount="indefinite" begin="1.7s"/>
      <animateTransform attributeName="transform" type="translate" values="0,12;0,12;0,0;0,-8;0,-8" keyTimes="0;0.05;0.2;0.75;1" dur="4.5s" repeatCount="indefinite" begin="1.7s"/>
      <rect x="-21" y="-15" width="42" height="30" rx="3" fill="rgba(91,130,232,0.09)" stroke="#5B82E8" stroke-width="1.2" stroke-opacity="0.65"/>
      <path d="M-13,9 L-4,-3 L5,9 Z" fill="rgba(91,130,232,0.55)"/>
      <path d="M-2,9 L9,-2 L16,9 Z" fill="rgba(91,130,232,0.35)"/>
      <circle cx="-11" cy="-5" r="3.5" fill="rgba(91,130,232,0.45)"/>
    </g>
  </g>

  <!-- Photo frame 3 — lower right — amber -->
  <g transform="translate(447,290)">
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.2;0.75;1" dur="4.5s" repeatCount="indefinite" begin="3.2s"/>
      <animateTransform attributeName="transform" type="translate" values="0,12;0,12;0,0;0,-8;0,-8" keyTimes="0;0.05;0.2;0.75;1" dur="4.5s" repeatCount="indefinite" begin="3.2s"/>
      <rect x="-21" y="-15" width="42" height="30" rx="3" fill="rgba(232,184,74,0.09)" stroke="#E8B84A" stroke-width="1.2" stroke-opacity="0.65"/>
      <path d="M-13,9 L-4,-3 L5,9 Z" fill="rgba(232,184,74,0.55)"/>
      <path d="M-2,9 L9,-2 L16,9 Z" fill="rgba(232,184,74,0.35)"/>
      <circle cx="-11" cy="-5" r="3.5" fill="rgba(232,184,74,0.45)"/>
    </g>
  </g>

  <!-- Location pin 1 — teal -->
  <g transform="translate(308,183)">
    <circle r="3.5" fill="#3DB995"/>
    <circle r="3.5" fill="none" stroke="#3DB995" stroke-width="1.2">
      <animate attributeName="r" values="3.5;13;3.5" dur="3s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
  </g>

  <!-- Location pin 2 — blue -->
  <g transform="translate(377,217)">
    <circle r="3.5" fill="#5B82E8"/>
    <circle r="3.5" fill="none" stroke="#5B82E8" stroke-width="1.2">
      <animate attributeName="r" values="3.5;13;3.5" dur="3s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
  </g>

  <!-- Location pin 3 — amber -->
  <g transform="translate(331,258)">
    <circle r="3.5" fill="#E8B84A"/>
    <circle r="3.5" fill="none" stroke="#E8B84A" stroke-width="1.2">
      <animate attributeName="r" values="3.5;13;3.5" dur="3s" repeatCount="indefinite" begin="2.0s"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite" begin="2.0s"/>
    </circle>
  </g>

  <!-- Camera icon at center -->
  <g transform="translate(340,208)">
    <rect x="-21" y="-12" width="42" height="28" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>
    <rect x="-7" y="-18" width="14" height="8" rx="2.5" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>
    <circle cy="3" r="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>
    <circle cy="3" fill="rgba(255,255,255,0.22)">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="14" cy="-4" r="2" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- Orbiting airplane -->
  <g>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
      <mpath href="#op"/>
    </animateMotion>
    <path d="M11,0 L-5,6.5 L-2,0 L-5,-6.5 Z" fill="white" opacity="0.92"/>
  </g>
</svg>